# Relais La Carotte (Cloudflare Worker + base D1), déployé par le workflow « Déploiement ».
name = "la-carotte-relais"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Variables données par le workflow au déploiement (wrangler deploy --var) : ALLOWED_ORIGINS (adresse de l'app
# publiée, CORS) et GITHUB_REPO (projet qui reçoit les codes-barres), tirées du nom du projet GitHub.

[[d1_databases]]
binding = "DB"
database_name = "la-carotte"
# Remplacé par l'identifiant réel de la base pendant le déploiement (workflow « Déploiement »).
database_id = "A_REMPLACER_AU_DEPLOIEMENT"
