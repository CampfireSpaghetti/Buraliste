name: Déploiement

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1' # chaque lundi 04:17 UTC : mise à jour de la liste Douane
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mise à jour de la liste officielle Douane
        if: github.event_name != 'push'
        run: npm run refs:update
      - run: npm test
      - name: Publication de la nouvelle liste (après les tests)
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- public/data/references.json; then
            DATE=$(node -e "console.log(require('./public/data/references.json').effectiveDate)")
            git config user.name "la-carotte-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/references.json
            git commit -m "chore: liste Douane $DATE"
            git push
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
