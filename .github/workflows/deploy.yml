name: Déploiement

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1' # chaque lundi 04:17 UTC : mise à jour de la liste Douane
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mise à jour de la liste officielle Douane
        id: refs
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run refs:update
      - name: Mise à jour de la liste des jeux FDJ
        id: fdj
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run fdj:update
      - run: npm test
      - name: Publication des listes mises à jour (après les tests)
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- public/data; then
            git config user.name "la-carotte-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "chore: listes Douane et FDJ du $(date +%Y-%m-%d)"
            git push
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Signaler une source qui n'a pas pu être lue
        if: steps.refs.outcome == 'failure' || steps.fdj.outcome == 'failure'
        run: |
          echo "::error::Liste Douane : ${{ steps.refs.outcome }} · Liste FDJ : ${{ steps.fdj.outcome }}. L'app garde la dernière liste connue."
          exit 1
